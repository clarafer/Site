<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif;}

input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover { opacity: 0.8; }

.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
  position: relative;
}

img.avatar {
  width: 100px;
  border-radius: 50%;
}

.container { padding: 16px; }

span.psw {
  float: right;
  padding-top: 16px;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.4);
  padding-top: 60px;
}

.modal-content {
  background-color: #fefefe;
  margin: 5% auto 15% auto;
  border: 1px solid #888;
  width: 80%;
}

.close {
  position: absolute;
  right: 25px;
  top: 0;
  color: #000;
  font-size: 35px;
  font-weight: bold;
}

.close:hover { color: red; cursor: pointer; }

.animate {
  animation: animatezoom 0.6s
}

@keyframes animatezoom {
  from {transform: scale(0)} 
  to {transform: scale(1)}
}
</style>
</head>
<body>

<h2>Sistema de Alunos - Design</h2>

<button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Abrir Login</button>

<div id="id01" class="modal">
  
  <form class="modal-content animate" onsubmit="return false;">
    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
      <img src="https://www.w3schools.com/howto/img_avatar2.png" alt="Avatar" class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>Nome do Aluno</b></label>
      <input type="text" id="utilizador" placeholder="Escreve o teu nome" required>

      <label for="psw"><b>Palavra-passe</b></label>
      <input type="password" id="senha" placeholder="Escreve a tua senha" required>
        
      <button type="button" onclick="fazerLogin()">Entrar no Sistema</button>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancelar</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// Configuração direta
const supabase = supabase.createClient('https://lcvafsnsvybjgmmzlwcu.supabase.co', 'sb_publishable_Ml4lqQo64uiULe7S8ICwqA_9D5VlwMB');

var modal = document.getElementById('id01');
window.onclick = function(event) {
    if (event.target == modal) { modal.style.display = "none"; }
}

async function fazerLogin() {
    console.log("Botão clicado!");
    
    // Pegar valores
    const userDigitado = document.getElementById('utilizador').value;
    const passDigitada = document.getElementById('senha').value;

    if(!userDigitado || !passDigitada) {
        alert("Preenche os campos!");
        return;
    }

    // Pedir dados ao Supabase
    const { data: aluno, error } = await supabase
        .from('Alunos')
        .select('*')
        .eq('Nome', userDigitado)
        .maybeSingle(); 

    if (error) {
        alert("Erro na Base de Dados: " + error.message);
        return;
    }

    if (!aluno) {
        alert("Utilizador não encontrado! Verifica se a Policy (RLS) está ativa com 'true'.");
        return;
    }

    // Comparar Password (Case Sensitive!)
    if (aluno.Pass === passDigitada) {
        alert("SUCESSO! Bem-vinda, " + aluno.Nome);
        modal.style.display = 'none';
    } else {
        alert("Password incorreta para o aluno " + userDigitado);
    }
}
</script>

</body>
</html>
